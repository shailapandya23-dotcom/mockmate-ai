# MockMate AI — Secrets Configuration
# Copy this file to secrets.toml and fill in your Gemini API key.
# On Streamlit Cloud, set these via the app dashboard → Settings → Secrets.

GEMINI_API_KEY = "your-gemini-api-key-here"

# Optional: override the Gemini model.
# Free tier: "gemini-1.5-flash" (higher quota) or "gemini-2.0-flash" (default)
# Paid tier: "gemini-2.0-flash", "gemini-1.5-pro"
# GEMINI_MODEL = "gemini-1.5-flash"
